name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            command: build:mac
            args: --arm64
          - platform: macOS-Intel
            runner: macos-15-intel
            command: build:mac
            args: --x64
          - platform: Windows
            runner: windows-latest
            command: build:win
            args: --x64
          - platform: Linux
            runner: ubuntu-latest
            command: build:linux
            args: --x64

    steps:
      - name: Check out Desk
        uses: actions/checkout@v4
        with:
          path: desk

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desk/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: desk
        run: pnpm install --frozen-lockfile

      - name: Build package
        working-directory: desk
        run: pnpm run ${{ matrix.command }} -- ${{ matrix.args }}

      - name: Verify macOS bundle signing
        if: startsWith(matrix.platform, 'macOS')
        working-directory: desk
        shell: bash
        run: |
          app_path=$(find dist -maxdepth 2 -type d -name 'TNotes Desk.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          entitlements=$(codesign -d --entitlements - "$app_path")
          printf '%s\n' "$entitlements"
          printf '%s\n' "$entitlements" \
            | grep -A2 -F '[Key] com.apple.security.cs.disable-library-validation' \
            | grep -Fq '[Bool] true'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: desk-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desk/dist/*.dmg
            desk/dist/*.zip
            desk/dist/*.exe
            desk/dist/*.AppImage
            desk/dist/*.deb
            desk/dist/*.blockmap
            desk/dist/latest*.yml

  publish:
    name: Publish GitHub Release
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Desk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No package artifacts uploaded; skipping release."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes --title "TNotes Desk $GITHUB_REF_NAME"
